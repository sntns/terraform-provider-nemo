name: CI

# Pull requests, main and a weekly run, in three stages, each once the
# previous one passed: the static checks, then the tests, then what a release
# publishes. The label ci/validate-only keeps a pull request to the static
# checks. The CI job alone is required.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Check that the docs are generated from the schema
        run: |
          go generate ./...
          git diff --exit-code docs || (echo "::error::run go generate ./... and commit docs" && exit 1)

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    env:
      # Space-separated, each with why. GO-2026-6941: github.com/qri-io/jsonschema, which cnab-go validates a bundle's
      # parameters with, has no fixed version, cnab-go's latest included. Remove it once one exists.
      IGNORED: GO-2026-6941
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go of go.mod, so that the scan covers the standard library the release is built with.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fail on a vulnerability the code reaches, but those ignored
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./... || true
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json ./... > govulncheck.json
          reached=$(jq -r 'select(.finding.trace[0].function) | .finding.osv' govulncheck.json | sort -u)
          left=$(comm -23 <(echo "$reached") <(tr ' ' '\n' <<< "$IGNORED" | sort -u) | sed '/^$/d')
          if [ -n "$left" ]; then
            echo "::error::the code reaches $(echo $left)"
            exit 1
          fi
          echo "the code reaches no vulnerability but those ignored: $IGNORED"

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  test:
    name: Unit tests
    needs: [lint, docs, govulncheck, workflows]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # The provider is published on both registries: each CLI runs the
  # acceptance tests.
  acceptance:
    name: Acceptance tests
    needs: [lint, docs, govulncheck, workflows]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - if: matrix.cli == 'tofu'
        run: |
          echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"
          echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org" >> "$GITHUB_ENV"
      - name: Make the runner's Docker a swarm manager, for the stacks on Swarm
        run: docker swarm init
      - name: Deploy, import and destroy stacks on the runner's Docker, with ${{ matrix.cli }}
        run: make testacc

  binaries:
    name: Binaries
    needs: [test, acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the release's archives and SHA256SUMS, unsigned and unpublished
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,publish

  ci:
    name: CI
    needs: [lint, docs, govulncheck, workflows, test, acceptance, binaries]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was left out by ci/validate-only
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "CI passed"
