name: CI

# release-please's pull requests change the changelog and the version only,
# of code that passed it: their jobs are skipped.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  test:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check that the docs are generated from the schema
        run: |
          go generate ./...
          git diff --exit-code docs || (echo "::error::run go generate ./... and commit docs" && exit 1)

  # The provider is published on both registries: each CLI runs the
  # acceptance tests.
  acceptance:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - if: matrix.cli == 'tofu'
        run: |
          echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"
          echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org" >> "$GITHUB_ENV"
      - name: Deploy, import and destroy stacks on the runner's Docker, with ${{ matrix.cli }}
        run: make testacc

  release:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the release's archives and SHA256SUMS, unsigned and unpublished
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,publish
